services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lemp-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php:/var/www/html:ro
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - appnet

  php:
    build:
      context: .
      dockerfile: php.Dockerfile
    container_name: lemp-php
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_DATABASE: testdb
    volumes:
      - ./php:/var/www/html:ro
    networks:
      - appnet

  db:
    image: mysql:8.4
    container_name: lemp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
